<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{product/_layout}">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
</head>
<body>

<div layout:fragment="content" class="container body-content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/products/add}" class="btn btn-primary">Create New Product</a>

        <!-- Sort buttons -->
        <div class="btn-group">
            <a th:href="@{/products(page=0, sort='', categoryId=${categoryId})}"
               class="btn btn-outline-secondary">Mặc định</a>
            <a th:href="@{/products(page=0, sort='asc', categoryId=${categoryId})}"
               class="btn btn-outline-secondary">Giá tăng dần ↑</a>
            <a th:href="@{/products(page=0, sort='desc', categoryId=${categoryId})}"
               class="btn btn-outline-secondary">Giá giảm dần ↓</a>
        </div>

        <!-- Dropdown filter category -->
        <form th:action="@{/products}" method="get">
            <input type="hidden" name="sort" th:value="${sort}">
            <input type="hidden" name="page" value="0">
            <select name="categoryId" class="form-select" onchange="this.form.submit()">
                <option value="">-- Tất cả danh mục --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${cat.id == categoryId}">
                </option>
            </select>
        </form>
    </div>

    <!-- Bảng sản phẩm -->
    <table class="table table-striped">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Image</th>
            <th scope="col">Price</th>
            <th scope="col">Category Name</th>
            <th scope="col">Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products.content}">
            <th scope="row" th:text="${product.id}"></th>
            <td th:text="${product.name}"></td>
            <td>
                <img height="50" width="35" th:src="${product.image}" alt="Product Image">
            </td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.category != null} ? ${product.category.name} : ''"></td>
            <td>
                <a th:href="@{/products/edit/{id}(id=${product.id})}"
                   class="btn btn-secondary btn-sm">Edit</a>
                <a th:href="@{/products/delete/{id}(id=${product.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure?')">Delete</a>

                <!-- Add to Cart -->
                <form th:action="@{/cart/add/{id}(id=${product.id})}"
                      method="post" style="display:inline">
                    <button type="submit" class="btn btn-success btn-sm">🛒 Add to Cart</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div class="d-flex justify-content-center align-items-center gap-3">
        <a th:if="${products.hasPrevious()}"
           th:href="@{/products(page=${products.number - 1}, sort=${sort}, categoryId=${categoryId})}"
           class="btn btn-outline-primary">Previous</a>

        <span>
            <span th:text="${products.number + 1}"></span> /
            <span th:text="${products.totalPages}"></span>
        </span>

        <a th:if="${products.hasNext()}"
           th:href="@{/products(page=${products.number + 1}, sort=${sort}, categoryId=${categoryId})}"
           class="btn btn-outline-primary">Next</a>
    </div>

</div>

</body>
</html>
